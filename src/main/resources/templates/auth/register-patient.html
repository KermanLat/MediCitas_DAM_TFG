<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro paciente — MediCitas</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f5f0e8;
            --white: #fdfcfa;
            --ink: #1a1a1a;
            --ink-light: #5a5a5a;
            --sage: #4a7c59;
            --sage-light: #6a9c79;
            --sage-pale: #e8f0ea;
            --red: #c0392b;
            --border: #ddd8ce;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 4px 40px rgba(26,26,26,0.08);
            width: 100%;
            max-width: 560px;
            padding: 48px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--ink-light);
            text-decoration: none;
            margin-bottom: 32px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--sage); }

        .form-header { margin-bottom: 32px; }

        .role-badge {
            display: inline-block;
            background: var(--sage-pale);
            color: var(--sage);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .form-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.9rem;
            color: var(--ink);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .form-subtitle {
            font-size: 0.85rem;
            color: var(--ink-light);
        }

        .form-subtitle a {
            color: var(--sage);
            text-decoration: none;
            font-weight: 500;
        }

        /* Grid de campos */
        .fields-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field-full { grid-column: 1 / -1; }

        .field-group { display: flex; flex-direction: column; }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        label .optional {
            font-weight: 400;
            color: #bbb;
            font-size: 0.75rem;
        }

        input {
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--ink);
            background: var(--white);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(74,124,89,0.1);
        }

        input::placeholder { color: #c5c0b8; }

        .field-hint {
            font-size: 0.72rem;
            color: #bbb;
            margin-top: 4px;
        }

        /* Error de validación */
        .field-error {
            font-size: 0.75rem;
            color: var(--red);
            margin-top: 4px;
        }

        input.error { border-color: var(--red); }

        /* Alerta general */
        .alert-error {
            background: #fdf0ef;
            border: 1px solid #f5c6c2;
            border-left: 3px solid var(--red);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--red);
            margin-bottom: 24px;
        }

        /* Separador de sección */
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ink-light);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 16px 0 8px;
            border-top: 1px solid var(--border);
            grid-column: 1 / -1;
            margin-top: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--ink);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 24px;
            letter-spacing: 0.01em;
        }

        .btn-primary:hover { background: #2d2d2d; }
        .btn-primary:active { transform: scale(0.99); }

        .login-link {
            text-align: center;
            font-size: 0.83rem;
            color: var(--ink-light);
            margin-top: 18px;
        }

        .login-link a {
            color: var(--sage);
            text-decoration: none;
            font-weight: 500;
        }

        @media (max-width: 560px) {
            .card { padding: 32px 24px; }
            .fields-grid { grid-template-columns: 1fr; }
            .field-full { grid-column: 1; }
        }
    </style>
</head>
<body>

<div class="card">

    <a th:href="@{/login}" class="back-link">← Volver al inicio de sesión</a>

    <div class="form-header">
        <div class="role-badge">Paciente</div>
        <h1 class="form-title">Crear cuenta</h1>
        <p class="form-subtitle">
            ¿Eres médico?
            <a th:href="@{/register/doctor}">Regístrate como doctor</a>
        </p>
    </div>

    <!-- Alerta de error general -->
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register/patient}" th:object="${registerPatientDTO}" method="post">
       <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> --> 

        <div class="fields-grid">

            <!-- Datos personales -->
            <div class="section-label">Datos personales</div>

            <div class="field-group field-full">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" th:field="*{nombre}"
                       placeholder="Ana García López" required
                       th:classappend="${#fields.hasErrors('nombre')} ? 'error'"/>
                <span class="field-error" th:if="${#fields.hasErrors('nombre')}"
                      th:errors="*{nombre}"></span>
            </div>

            <div class="field-group field-full">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="ana@email.com" required
                       th:classappend="${#fields.hasErrors('email')} ? 'error'"/>
                <span class="field-error" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="field-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Mínimo 8 caracteres" required
                       th:classappend="${#fields.hasErrors('password')} ? 'error'"/>
                <span class="field-error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>

            <div class="field-group">
                <label for="confirmPassword">Repetir contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="••••••••" required/>
            </div>

            <div class="field-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" required/>
            </div>

            <div class="field-group">
                <label for="telefono">Teléfono <span class="optional">(opcional)</span></label>
                <input type="tel" id="telefono" th:field="*{telefono}"
                       placeholder="600 000 000"/>
            </div>

            <!-- Datos médicos -->
            <div class="section-label">Datos médicos</div>

            <div class="field-group field-full">
                <label for="numSeguro">Número de seguro médico <span class="optional">(opcional)</span></label>
                <input type="text" id="numSeguro" th:field="*{numSeguro}"
                       placeholder="ES-123456789"/>
                <span class="field-hint">Puedes añadirlo más tarde desde tu perfil</span>
            </div>

        </div>

        <button type="submit" class="btn-primary">Crear cuenta de paciente</button>
    </form>

    <p class="login-link">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>

</div>

</body>
</html>

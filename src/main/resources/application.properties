# ── Base de datos ─────────────────────────────────────────────────────────────
spring.application.name=proyectoKermanLatorre_DAM
spring.datasource.url=${DB_URL:jdbc:mysql://localhost/proyectodam?allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT (obligatorio: clave en Base64, p. ej. `openssl rand -base64 32`) ─────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Google Calendar (obligatorio para la integración con el calendario) ──────
google.calendar.app-name=proyectoKermanLatorre
google.calendar.client-id=${GOOGLE_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# ── Doctor inicial (opcional): si se definen ambas, se crea al arrancar ──────
app.seed.doctor-email=${SEED_DOCTOR_EMAIL:}
app.seed.doctor-password=${SEED_DOCTOR_PASSWORD:}

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080
